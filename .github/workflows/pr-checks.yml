name: PR checks

on:
  pull_request:
  push:
    branches:
      - fix/chatgpt-session-coordinator

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: |
          bash -n \
            scripts/status.sh \
            scripts/run-all.sh \
            scripts/setup-hermes-control.sh \
            scripts/start-bridge.sh
